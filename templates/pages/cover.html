{% extends "base.html" %}
{% block content %}
<section id="screen-cover" class="screen active active soft-mint-bg relative select-none">
  <div class="absolute inset-0 dot-pattern-overlay pointer-events-none z-0"></div>
  <div class="absolute top-[22%] left-1/2 -translate-x-1/2 w-80 h-80 rounded-full ambient-glow-1 pointer-events-none z-0"></div>
  <div class="absolute bottom-[20%] right-[-10%] w-72 h-72 rounded-full ambient-glow-2 pointer-events-none z-0"></div>

  <header class="w-full pt-3.5 px-7 flex justify-between items-center z-20 text-slate-800 font-medium text-xs tracking-tight shrink-0">
    <span class="text-[15px] font-bold tracking-tight text-slate-900">9:41</span>
    <div class="flex items-center space-x-2">
      <svg class="w-4 h-4 fill-slate-800" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <svg class="w-4 h-4 fill-slate-800" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4z"></path></svg>
      <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center"><div class="h-full w-3 bg-slate-800 rounded-2xs"></div></div>
    </div>
  </header>

  <section class="flex-1 flex flex-col items-center justify-center px-5 z-10 w-full">
    <div class="w-full flex flex-col items-center text-center relative overflow-hidden">
      <div class="w-16 h-16 rounded-full bg-emerald-700 flex items-center justify-center mb-6 shadow-lg shadow-emerald-800/25"><span class="material-symbols-outlined text-white text-[32px]">eco</span></div>
      <h1 class="text-[34px] sm:text-[38px] font-extrabold text-[#064e3b] tracking-tight leading-tight mb-3 font-display">Energy Coach</h1>
      <p class="text-slate-600 text-[14px] sm:text-[15px] font-medium leading-relaxed tracking-tight px-1 max-w-[280px]">PC방 전력 낭비 분석부터<br>실시간 요금 최적화까지</p>
    </div>
  </section>

  <footer class="w-full px-5 pb-8 z-10 flex flex-col items-center gap-3 shrink-0">
    <div class="inline-flex items-center gap-2 mb-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-[14px] font-semibold text-emerald-900 tracking-tight">AI 에너지 코치</span></div>
    <button aria-label="서비스 시작하기" onclick="goTo('survey')" class="w-full h-14 bg-emerald-700 active:scale-[0.98] hover:bg-emerald-800 transition-all duration-200 text-white font-bold text-[16px] rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-800/25 cursor-pointer" type="button">시작하기</button>
    <p class="text-xs text-slate-600 font-medium tracking-tight text-center">스마트 전력 제어 및 요금 최적화 솔루션</p>
    <div class="w-32 h-1 bg-slate-800/30 rounded-full mt-2"></div>
  </footer>
</section>
{% endblock %}
